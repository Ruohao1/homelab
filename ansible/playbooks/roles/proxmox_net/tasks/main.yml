- name: Assert we're on Proxmox (pveversion exists)
  command: pveversion
  changed_when: false

- name: Ensure ifupdown2 is installed (needed for ifreload)
  apt:
    name: ifupdown2
    state: present

- name: Disable IPv4 forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    state: present
    reload: true
  when: phase1_no_routing | bool

- name: Backup interfaces file (one-time canonical backup)
  copy:
    src: "{{ interfaces_path }}"
    dest: "{{ interfaces_path }}.bak"
    remote_src: true
    mode: "0644"
    force: false
  when: backup_interfaces | bool

- name: Render /etc/network/interfaces
  template:
    src: interfaces.j2
    dest: "{{ interfaces_path }}"
    mode: "0644"
    backup: true
  notify: Reload networking safely

- name: Apply network changes (optional toggle)
  meta: flush_handlers
  when: apply_network | bool

# --- Post-checks (fail fast) ---

- name: Assert forwarding is still disabled
  command: sysctl -n net.ipv4.ip_forward
  register: ipf
  changed_when: false
  failed_when: phase1_no_routing | bool and ipf.stdout.strip() != "0"

- name: Assert only mgmt bridge has an IP (best-effort check)
  shell: |
    set -o pipefail
    ip -br addr | awk '$1 ~ /^vmbr_/ {print $1,$3}' | sed 's/  */ /g'
  register: vmbr_addrs
  changed_when: false

- name: Show vmbr IP summary
  debug:
    var: vmbr_addrs.stdout_lines
